name: Custom Release

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Windows (x86_64)'
        required: true
        default: true
        type: boolean
      linux:
        description: 'Linux (x86_64)'
        required: true
        default: true
        type: boolean
      macos_x64:
        description: 'macOS (x86_64 / Intel)'
        required: true
        default: false
        type: boolean
      macos_arm64:
        description: 'macOS (ARM64 / Apple Silicon)'
        required: true
        default: false
        type: boolean
      android:
        description: 'Android'
        required: true
        default: false
        type: boolean
      iOS:
        description: 'iOS'
        required: true
        default: false
        type: boolean
      tag_name:
        description: 'Release tag name (leave empty to auto-generate)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  PROJECT_NAME: KathyEngine
  REPO_PATH: kittycathy114/FNF-KathyEngine
  HAXE_VERSION: 4.3.7

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.commit_hash }}
    steps:
      - name: Verify Repo
        run: |
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "REPO_PATH: ${{ env.REPO_PATH }}"
          if [[ "$GITHUB_REPOSITORY" != "${{ env.REPO_PATH }}" ]]; then
            echo "Doesn't seem to be correct, returning SIGABRT..."
            exit 6
          else
            echo "Seems to be correct..."
          fi

      - name: Get Commit Hash
        id: get_commit_hash
        run: |
          if [ -n "$GITHUB_SHA" ]; then
            commit_hash="${GITHUB_SHA::7}"
          else
            commit_hash=$(git rev-parse --short HEAD)
          fi
          echo "commit_hash=$commit_hash" >> $GITHUB_OUTPUT
          echo "Latest commit hash: $commit_hash"
          if [[ -z "$commit_hash" || ! "$commit_hash" =~ ^[a-f0-9]{7}$ ]]; then
            echo "Invalid commit_hash: $commit_hash"
            exit 1
          fi

  build-windows:
    name: Windows
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.windows }}
    with:
      name: Windows
      os: windows-2022
      setupCommand: .\setup\windows.bat
      buildArgs: "windows -final -D officialBuild"
      artifactName: windowsBuild-x86_64
      artifactPath: export\release\windows\bin\*

  build-linux:
    name: Linux
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.linux }}
    with:
      name: Linux
      os: ubuntu-22.04
      setupCommand: sh ./setup/unix.sh
      buildArgs: "linux -final -D officialBuild"
      artifactName: linuxBuild-x86_64
      artifactPath: export/release/linux/bin/*

  build-macos-x64:
    name: macOS x86_64
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.macos_x64 }}
    with:
      name: macOS x86_64
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "mac -64 -D HXCPP_M64 -final -D officialBuild"
      artifactName: macOSBuild-x86_64
      artifactPath: export/release/macos/bin/*

  build-macos-arm64:
    name: macOS ARM64
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.macos_arm64 }}
    with:
      name: macOS ARM64
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "mac -arm64 -D HXCPP_ARM64 -final -D officialBuild"
      artifactName: macOSBuild-arm64
      artifactPath: export/release/macos/bin/*

  build-android:
    name: Android
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.android }}
    with:
      name: Android
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "android -final -D officialBuild"
      artifactName: androidBuild
      artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

  build-ios:
    name: iOS
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.iOS }}
    with:
      name: iOS
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "ios -final -nosign -D officialBuild"
      artifactName: iOSBuild
      artifactPath: export/release/ios/build/Release-iphoneos/*.ipa

  release:
    name: Release
    needs: [get-commit-hash, build-windows, build-linux, build-macos-x64, build-macos-arm64, build-android, build-ios]
    if: ${{ always() && (inputs.windows || inputs.linux || inputs.macos_x64 || inputs.macos_arm64 || inputs.android || inputs.iOS) }}
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Windows
        if: ${{ inputs.windows }}
        uses: actions/download-artifact@v4
        with:
          name: windowsBuild-x86_64
          path: builds/windows

      - name: Download Linux
        if: ${{ inputs.linux }}
        uses: actions/download-artifact@v4
        with:
          name: linuxBuild-x86_64
          path: builds/linux

      - name: Download macOS x64
        if: ${{ inputs.macos_x64 }}
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-x86_64
          path: builds/macos-x64

      - name: Download macOS arm64
        if: ${{ inputs.macos_arm64 }}
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-arm64
          path: builds/macos-arm64

      - name: Download Android
        if: ${{ inputs.android }}
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
          path: builds/android

      - name: Download iOS
        if: ${{ inputs.iOS }}
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild
          path: builds/ios

      - name: Compress & Prepare
        run: |
          sudo apt-get install p7zip-full
          if [ -d builds/windows ]; then cd builds/windows && 7z a -tzip ../../${{ env.PROJECT_NAME }}-windows.zip ./* && cd ../..; fi
          if [ -d builds/linux ]; then cd builds/linux && 7z a -tzip ../../${{ env.PROJECT_NAME }}-linux.zip ./* && cd ../..; fi
          if [ -d builds/macos-x64 ]; then cd builds/macos-x64 && 7z a -tzip ../../${{ env.PROJECT_NAME }}-macos-x64.zip ./* && cd ../..; fi
          if [ -d builds/macos-arm64 ]; then cd builds/macos-arm64 && 7z a -tzip ../../${{ env.PROJECT_NAME }}-macos-arm64.zip ./* && cd ../..; fi
          if [ -d builds/android ]; then cp builds/android/*.apk ./${{ env.PROJECT_NAME }}-android.apk; fi
          if [ -d builds/ios ]; then cp builds/ios/*.ipa ./${{ env.PROJECT_NAME }}-ios.ipa; fi

      - name: Generate Release Name
        id: release_name
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=release-${{ needs.get-commit-hash.outputs.commit_hash }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ needs.get-commit-hash.outputs.commit_hash }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_name.outputs.name }}
          tag_name: ${{ steps.release_name.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ (inputs.windows && format('{0}-windows.zip', env.PROJECT_NAME)) || '' }}
            ${{ (inputs.linux && format('{0}-linux.zip', env.PROJECT_NAME)) || '' }}
            ${{ (inputs.macos_x64 && format('{0}-macos-x64.zip', env.PROJECT_NAME)) || '' }}
            ${{ (inputs.macos_arm64 && format('{0}-macos-arm64.zip', env.PROJECT_NAME)) || '' }}
            ${{ (inputs.android && format('{0}-android.apk', env.PROJECT_NAME)) || '' }}
            ${{ (inputs.iOS && format('{0}-ios.ipa', env.PROJECT_NAME)) || '' }}
